[project]
name = "policy-manager"
version = "0.1.0"
description = "Privacy and Governance Policy Manager for Federated CBDC Fraud Detection"
authors = [
    { name = "WAD Dusman Nalin Dayawansha" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
