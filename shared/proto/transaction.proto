syntax = "proto3";

package transaction;

import "google/protobuf/timestamp.proto";

service TransactionGraphService {
  rpc AddTransaction (Transaction) returns (TransactionResponse);
  rpc GetSubGraph (GraphQuery) returns (GraphData);
}

message Transaction {
  string transaction_id = 1;
  string source_account = 2;
  string target_account = 3;
  double amount = 4;
  string asset_type = 5; // e.g., "CBDC"
  google.protobuf.Timestamp timestamp = 6;
  map<string, string> metadata = 7;
}

message TransactionResponse {
  bool success = 1;
  string message = 2;
  string node_id = 3;
}

message GraphQuery {
  string center_node_id = 1;
  int32 depth = 2;
}

message GraphNode {
  string id = 1;
  string type = 2; // "Account" or "Transaction"
  map<string, string> properties = 3;
}

message GraphRelationship {
  string id = 1;
  string source_id = 2;
  string target_id = 3;
  string type = 4; // "SENDS", "RECEIVES", "OWNED_BY"
  map<string, string> properties = 5;
}

message GraphData {
  repeated GraphNode nodes = 1;
  repeated GraphRelationship relationships = 2;
}
