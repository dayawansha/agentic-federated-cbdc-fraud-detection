syntax = "proto3";

package federated;

import "google/protobuf/timestamp.proto";

// Service for Federated Learning Coordination (Coordinator Side)
service FederatedCoordinator {
  // Agents register with the coordinator
  rpc RegisterAgent (AgentInfo) returns (RegistrationResponse);
  
  // Agents submit model updates after local training
  rpc SubmitUpdate (ModelUpdate) returns (SubmissionResponse);
  
  // Agents heartbeat to stay in the active pool
  rpc Heartbeat (AgentHeartbeat) returns (HeartbeatResponse);
}

// Service for Federated Learning Operations (Agent Side)
service FederatedAgent {
  // Coordinator triggers a training round on the agent
  rpc StartTrainingRound (RoundConfig) returns (TrainingStatus);
  
  // Coordinator requests local metrics evaluation
  rpc EvaluateModel (ModelConfig) returns (MetricsReport);
}

// Service for Secure Aggregation
service SecureAggregator {
  // Coordinator triggers aggregation of current round updates
  rpc AggregateUpdates (AggregationRequest) returns (AggregationResponse);
}

message AgentInfo {
  string agent_id = 1;
  string bank_id = 2;
  string endpoint = 3;
  map<string, string> capabilities = 4;
}

message RegistrationResponse {
  bool success = 1;
  string message = 2;
  string assigned_id = 3;
}

message ModelUpdate {
  string agent_id = 1;
  string round_id = 2;
  bytes weights_delta = 3; // Serialized model weights or gradients
  int32 sample_size = 4;
  map<string, float> metrics = 5;
  google.protobuf.Timestamp client_timestamp = 6;
}

message SubmissionResponse {
  bool accepted = 1;
  string message = 2;
}

message AgentHeartbeat {
  string agent_id = 1;
  float current_load = 2;
}

message HeartbeatResponse {
  bool status = 1;
  string next_action = 2; // e.g., "IDLE", "TRAIN", "EVALUATE"
}

message RoundConfig {
  string round_id = 1;
  string model_version = 2;
  bytes global_weights = 3; // Initial global weights for this round
  map<string, string> hyperparameters = 4;
  google.protobuf.Timestamp deadline = 5;
}

message TrainingStatus {
  enum State {
    STARTED = 0;
    IN_PROGRESS = 1;
    COMPLETED = 2;
    FAILED = 3;
  }
  State state = 1;
  string message = 2;
}

message ModelConfig {
  string model_id = 1;
  bytes weights = 2;
}

message MetricsReport {
  string agent_id = 1;
  map<string, float> performance_metrics = 2; // Precision, Recall, F1, etc.
}

message AggregationRequest {
  string round_id = 1;
  repeated string agent_ids = 2;
  string strategy = 3; // e.g., "FedAvg", "FedGNN"
}

message AggregationResponse {
  bool success = 1;
  bytes aggregated_weights = 2;
  map<string, float> global_metrics = 3;
}
