server {
  listen 3001;

  root /usr/share/nginx/html;
  index index.html;

  location /api/local-agent/ {
    proxy_pass http://local-agent:9001/;
  }

  location /api/local-gnn/ {
    proxy_pass http://local-gnn:9002/;
  }

  location /api/privacy-layer/ {
    proxy_pass http://privacy-layer:9003/;
  }

  location /api/transaction-graph/ {
    proxy_pass http://transaction-graph:9004/;
  }

  location /api/alerting/ {
    proxy_pass http://alerting:9005/;
  }

  location /api/model-registry/ {
    proxy_pass http://model-registry:8004/;
  }

  location /api/policy-manager/ {
    proxy_pass http://policy-manager:8003/;
  }

  location /ws/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_pass http://alerting:9005/ws/;
  }

  location = /kafka-ui {
    return 301 /kafka-ui/;
  }

  location /kafka-ui/ {
    proxy_pass http://kafka-ui:8080;
  }

#   location /redis-insight/ {
#     proxy_pass http://redis-insight:5540/;
#     proxy_set_header Host $host;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
