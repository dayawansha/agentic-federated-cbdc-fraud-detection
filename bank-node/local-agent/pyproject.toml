[project]
name = "local-agent"
version = "0.1.0"
description = "Autonomous Local Agent for Federated CBDC Fraud Detection"
authors = [
    { name = "WAD Dusman Nalin Dayawansha" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "langchain>=0.0.200",
    "langgraph>=0.0.10",
    "confluent-kafka>=2.1.0",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
